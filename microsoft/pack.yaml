# Microsoft 365 documents as a pack of kind source: the integration,
# imported into the yard and into no depot. What Microsoft is here: the
# declared source microsoft, which lists SharePoint sites, a site's
# libraries and a library's folders, reads an item's metadata and link,
# and searches documents, all through Microsoft Graph as one Entra app.
# Its credential mints from the app's tenant, id and secret, by
# microsoft-mint, the mint command the pack brings beside its
# declaration. Read only; it downloads no file bytes, though search hits
# may carry short text excerpts from Graph.
#
#   yardr pack apply /Users/mckean/projects/repos/yardr-packs/microsoft
#
# The source is named microsoft: a pack is named after the service it
# talks to. A pack of kind source asks no grants at import, so what a
# crew member may call is granted afterwards, by the setup notes. The
# app reads whatever it was consented to, one identity for the yard, so
# every agent granted a call reads all of it.
name: microsoft
kind: source
setup: SETUP.md

sources:
  microsoft:
    declaration: microsoft.yaml

# Suggested grants: named sets of the source's calls, printed numbered by
# pack show. Suggesting grants nothing: the operator grants them, and
# terminal pack apply ignores them.
presets:
  read:
    about: List sites, libraries and folders, search documents and read an item's metadata and link; change nothing
    grants:
      microsoft: [read]
