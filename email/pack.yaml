# Mail as a pack of kind source: the integration, imported into the
# yard and into no depot. What mail is here: one envelope per message
# sent to yardmaster@yardr.dev, heard through a Cloudflare Email Worker
# that POSTs each message to the yard's hook, signed with the hook's
# secret. Inbound only: the yard never answers from the address.
#
#   yardr pack apply /Users/mckean/projects/repos/yardr-packs/email
#
# The source is named email: yardr knows mail as this pack alone.
name: email
kind: source
setup: SETUP.md

sources:
  email:
    declaration: email.yaml
