# Confluence Cloud as a declared source: spaces listed, content found by
# CQL, one page read, the children of a page, folder, whiteboard,
# database or embed listed, and a page's comments, replies, labels and
# attachments listed. Reads only. Jira's declaration (the jira
# pack, beside this one) is the pattern for the login and the site's
# address, and yardr's google-docs for a read call whose answer is
# bounded; Confluence differs where noted.
#
# Checked against Atlassian's OpenAPI descriptions of the Confluence Cloud
# REST API (v2 and v1) and its developer and support pages on 2 November
# 2026, and by GET requests without a login to a public Confluence Cloud
# site, which gave the shapes of the answers and of the cursors. Not
# checked with a credential against a site of our own: a person has to make
# one (README.md says what that leaves open).
#   spaces:   GET /wiki/api/v2/spaces takes read:space:confluence and
#     answers {results, _links}. _links.next is there only when another
#     page is, and is the path of the next page with its cursor in it. v2
#     also gives that address in a Link header, which a declared call
#     cannot read, so the cursor is a parameter and the body's _links stays.
#   page:     GET /wiki/api/v2/pages/{id} takes read:page:confluence.
#     body-format=storage puts the body at body.storage.value. Confluence
#     storage format is XHTML with Confluence's own tags and macros
#     (ac:structured-macro, ri:page), and it is what comes back: turning
#     it into text is the reader's.
#   children: GET /wiki/api/v2/{kind}/{id}/direct-children takes
#     read:hierarchical-content:confluence. Atlassian marks the older
#     /pages/{id}/children deprecated, the one deprecated operation in v2.
#     The newer one answers a page's pages and also its folders,
#     whiteboards, databases and embeds, each with a type. The same
#     operation is also at /folders/{id}/direct-children,
#     /whiteboards/{id}/direct-children, /databases/{id}/direct-children
#     and /embeds/{id}/direct-children, with the same scope, parameters
#     and answer, so one call walks all five. Its kind is a child's type
#     and an s. It is an enum
#     because it becomes a segment of the path, and the enum is the only
#     check on it. Left out it is pages, so a call that names no kind
#     asks the page endpoint. A default in a path is what pack.yaml's
#     api: 3 is for.
#   search:   GET /wiki/rest/api/content/search takes search:confluence.
#     CQL search is v1 only: Atlassian has no v2 equivalent, and has said
#     it would deprecate this one only when there is. A hit is
#     {id, type, status, title, _links} and the rest of its keys are
#     empty objects and the paths of what expand would add; _links.webui
#     names the space (/spaces/ENG/pages/123/Title), so nothing is
#     expanded. The cursor is the one in _links.next, percent-decoded:
#     that address writes it percent-encoded, and the call encodes it
#     again. Its start is echoed and ignored, so none is declared.
#
# The comments, labels and attachments of a page were checked the same
# way on 4 November 2026: the OpenAPI description of v2, and GET requests
# without a login to a public Confluence Cloud site. The site had no
# inline comment to show, so the inline shapes are the description's.
#   comments: GET /wiki/api/v2/pages/{id}/footer-comments and
#     /wiki/api/v2/pages/{id}/inline-comments take read:comment:confluence
#     and answer {results, _links}, paged as spaces is. Both list the root
#     comments of the page and no reply: the description says root, and on
#     a page whose comment has a reply the list gave the comment alone. A
#     comment has no body unless body-format is named, so it is fixed to
#     storage as page's is, and the body is at body.storage.value, markup
#     and not text. A footer comment belongs to the page. An inline comment
#     is on a passage of its text, and adds properties.inlineOriginalSelection,
#     the passage. Either may carry resolutionStatus (open, reopened,
#     resolved or dangling): the footer comments of the public site did,
#     though the description lists it for inline comments only. The two are
#     one call because only a segment of the path differs, and that segment
#     is kind, an enum, the only check on it. It has no default: with footer
#     for one, a call that left kind out would read the footer comments and
#     look complete. A page id that does not exist answered 400 here, though
#     the description says 404; labels and attachments answered 404.
#   replies:  GET /wiki/api/v2/footer-comments/{id}/children and
#     /wiki/api/v2/inline-comments/{id}/children take the same scope and
#     answer the replies to one comment, each with parentCommentId. A reply
#     may have replies of its own, so a thread is walked down by id, with
#     the kind of the comment it started from. The other kind is no error:
#     a footer comment's id asked as inline answered 200 and an empty list.
#   labels:   GET /wiki/api/v2/pages/{id}/labels takes read:page:confluence,
#     which page needs already, and answers {results, _links}. A label is
#     {id, name, prefix}.
#   attachments: GET /wiki/api/v2/pages/{id}/attachments takes
#     read:attachment:confluence and answers the files attached to a page
#     as metadata: id, title (the file's name), mediaType, fileSize,
#     status, createdAt, version, comment, downloadLink and webuiLink. Both
#     links are paths on the site, which _links.base completes. Nothing
#     here follows one: what a file holds is yardr-racg's to settle. A
#     file's entry is about a kilobyte, so 250 may pass the bound of 256 KiB.
#
# The credential. Atlassian takes an API token as HTTP Basic, the base64 of
# "email:token". A declared call's header takes one {credential}, so the
# email and the token are two mint inputs and confluence/mint makes the one
# value every call takes, CONFLUENCE_AUTH. The email is no secret, so it is
# asked in the clear. They live in the source's own env file; the
# jira pack's source has one of its own and is given the same two values
# again. Atlassian's form for a token with scopes has you choose the app
# first, so Jira's token is not made for Confluence, where a token made
# without scopes is the account's and serves both (SETUP.md, step 1).
#
# The host. Confluence is per site, so this is a placeholder that SETUP.md
# has the operator replace in the yard's copy of this file: the credential
# goes to the hosts a file names and to no others. A token with scopes is
# called at https://api.atlassian.com/ex/confluence/<cloud id>/wiki and one
# without at https://<site>.atlassian.net/wiki (Atlassian's support
# article on scoped tokens). Both take Basic, so only the base differs, and
# the /wiki is the base's, so every path below starts at /api or /rest. A
# pack applied again replaces the yard's copy and puts this one back
# (SETUP.md, step 6).
name: confluence
about: Confluence Cloud pages read through its REST API; spaces listed, content found by CQL, one page read, the children of a page, folder, whiteboard, database or embed listed, and a page's comments, replies, labels and attached files listed.
base: https://example.atlassian.net/wiki
credential:
  env: CONFLUENCE_AUTH
  header: "Authorization: Basic {credential}"
  mint:
    - name: CONFLUENCE_EMAIL
      secret: false               # an address, asked in the clear
    - CONFLUENCE_API_TOKEN
  mint_command: [confluence/mint]   # the program beside this file; the source's own mint_command wins over it
check: spaces
calls:
  spaces:
    kind: read
    about: List the spaces the account may see, 25 at a time. Answers each space's id, key, name, type and homepageId, the page children starts from. keys narrows it to spaces by key, as an address shows it (/spaces/ENG/...). When more than limit follow, _links.next is in the answer, and its cursor= value is the next call's cursor.
    params:
      keys: { type: string, max: 500, optional: true, log: true }   # space keys, comma-separated; left out, every space the account may see
      limit: { type: int, default: 25 }   # spaces in the page, 250 at most
      cursor: { type: string, max: 1000, optional: true }   # the cursor= of the last answer's _links.next
    request:
      method: GET
      path: /api/v2/spaces
      query: { keys: "{keys}", limit: "{limit}", cursor: "{cursor}" }
    answer: { select: [results, _links], max: 262144 }   # 250 spaces are about 100 KB
  page:
    kind: read
    about: Read one page by its id, which is in its address (/spaces/ENG/pages/123456/Title). Answers its title, status, spaceId, parentId, version and links, and its body in Confluence storage format, in body.storage.value, which is XHTML with Confluence's own tags and macros, markup and not text.
    params:
      id: { type: string, pattern: "^[0-9]+$", max: 20, log: true }
    request:
      method: GET
      path: /api/v2/pages/{id}
      query: { body-format: storage }
    answer: { select: [id, status, title, spaceId, parentId, parentType, version, body, _links], max: 262144 }   # a page's body is bounded as google-docs bounds a document's
  children:
    kind: read
    about: List the direct children of a page, folder, whiteboard, database or embed, 25 at a time, in the order of the tree. Answers each child's id, title, status and type (page, folder, whiteboard, database or embed). To go down a level, give the child's id, and give its type with an s as kind. A child whose type is folder takes kind=folders. kind is one of pages (the default), folders, whiteboards, databases and embeds. When more than limit follow, _links.next is in the answer, and its cursor= value is the next call's cursor, with the same id and kind.
    params:
      id: { type: string, pattern: "^[0-9]+$", max: 20, log: true }
      kind: { type: enum, values: [pages, folders, whiteboards, databases, embeds], default: pages, log: true }   # the sort of node id is, written as a child's type and an s
      limit: { type: int, default: 25 }   # children in the page, 250 at most
      cursor: { type: string, max: 1000, optional: true }   # the cursor= of the last answer's _links.next
    request:
      method: GET
      path: /api/v2/{kind}/{id}/direct-children
      query: { limit: "{limit}", cursor: "{cursor}" }
    answer: { select: [results, _links] }
  search:
    kind: read
    about: Find content by CQL, Confluence's query language, 25 at a time, as in type = page AND space = "ENG" AND title ~ "runbook". Answers each hit's id, type, status, title and _links.webui, which names its space. When more than limit follow, _links.next is in the answer, and its cursor= value, percent-decoded, is the next call's cursor.
    params:
      cql: { type: string, max: 2000 }   # free text, CQL: its value is in no event
      limit: { type: int, default: 25 }   # hits in the page; Confluence may hold it lower
      cursor: { type: string, max: 1000, optional: true }   # the cursor= of the last answer's _links.next, percent-decoded
    request:
      method: GET
      path: /rest/api/content/search
      query: { cql: "{cql}", limit: "{limit}", cursor: "{cursor}" }
    answer: { select: [results, size, limit, _links], max: 262144 }   # a hit is about 800 bytes, most of it empty keys
  comments:
    kind: read
    about: List the comments on a page, given by its id, 25 at a time, of one kind. kind=footer is the discussion under the page and kind=inline is the comments on a passage of its text, so a page is read with both. Only the first comment of each thread is listed here; its replies are the call replies, by the comment's id. Answers each comment's id, status, pageId, version (number, authorId, createdAt) and its body, in Confluence storage format, in body.storage.value, markup and not text. A comment may have resolutionStatus (open, reopened, resolved or dangling), and an inline comment has properties.inlineOriginalSelection, the passage it is on. When more than limit follow, _links.next is in the answer, and its cursor= value is the next call's cursor.
    params:
      id: { type: string, pattern: "^[0-9]+$", max: 20, log: true }   # the page's id, from its address (/spaces/ENG/pages/123456/Title)
      kind: { type: enum, values: [footer, inline], log: true }   # no default: a call that leaves it out is refused, not taken for all the comments
      limit: { type: int, default: 25 }   # comments in the page, 250 at most
      cursor: { type: string, max: 1000, optional: true }   # the cursor= of the last answer's _links.next
    request:
      method: GET
      path: /api/v2/pages/{id}/{kind}-comments
      query: { body-format: storage, limit: "{limit}", cursor: "{cursor}" }
    answer: { select: [results, _links], max: 262144 }   # the bodies are bounded as page's is
  replies:
    kind: read
    about: List the replies to one comment, 25 at a time. Give the comment's id and its kind, footer or inline, as comments lists it. A kind that is not the comment's is no error and answers an empty list. Answers each reply as a comment is answered, with parentCommentId, the id of the comment it answers. A reply may have replies of its own, and its id with the same kind goes down a level. When more than limit follow, _links.next is in the answer, and its cursor= value is the next call's cursor.
    params:
      id: { type: string, pattern: "^[0-9]+$", max: 20, log: true }   # the comment's id
      kind: { type: enum, values: [footer, inline], log: true }   # the comment's kind, as comments takes it
      limit: { type: int, default: 25 }   # replies in the page, 250 at most
      cursor: { type: string, max: 1000, optional: true }   # the cursor= of the last answer's _links.next
    request:
      method: GET
      path: /api/v2/{kind}-comments/{id}/children
      query: { body-format: storage, limit: "{limit}", cursor: "{cursor}" }
    answer: { select: [results, _links], max: 262144 }   # the bodies are bounded as page's is
  labels:
    kind: read
    about: List the labels on a page, given by its id, 25 at a time. Answers each label's id, name and prefix. When more than limit follow, _links.next is in the answer, and its cursor= value is the next call's cursor.
    params:
      id: { type: string, pattern: "^[0-9]+$", max: 20, log: true }   # the page's id
      limit: { type: int, default: 25 }   # labels in the page, 250 at most
      cursor: { type: string, max: 1000, optional: true }   # the cursor= of the last answer's _links.next
    request:
      method: GET
      path: /api/v2/pages/{id}/labels
      query: { limit: "{limit}", cursor: "{cursor}" }
    answer: { select: [results, _links] }   # a label is about 60 bytes, so 250 fit the default bound
  attachments:
    kind: read
    about: List the files attached to a page, given by its id, 25 at a time. Answers the metadata of each file and not the file. That is its id, title (the file's name), mediaType, fileSize in bytes, status, createdAt, version, comment, and downloadLink and webuiLink, which are paths on the site that go after _links.base. Nothing here fetches a file. When more than limit follow, _links.next is in the answer, and its cursor= value is the next call's cursor.
    params:
      id: { type: string, pattern: "^[0-9]+$", max: 20, log: true }   # the page's id
      limit: { type: int, default: 25 }   # attachments in the page, 250 at most
      cursor: { type: string, max: 1000, optional: true }   # the cursor= of the last answer's _links.next
    request:
      method: GET
      path: /api/v2/pages/{id}/attachments
      query: { limit: "{limit}", cursor: "{cursor}" }
    answer: { select: [results, _links], max: 262144 }   # an attachment is about 1 KB, so 250 may pass this bound, and a smaller limit then fits
