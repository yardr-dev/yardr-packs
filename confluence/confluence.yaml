# Confluence Cloud as a declared source: spaces listed, content found by
# CQL, one page read, the children of a page, folder, whiteboard,
# database or embed listed, a page's comments, replies, labels and
# attachments listed, and an author named from an account id; and two
# writes, a page created under a parent and a page's title and body
# updated at its version. Nothing else is written: no delete, no move, no
# comment, label or attachment.
# Jira's declaration (the jira pack, beside this one) is the pattern for
# the login and the site's address, and yardr's google-docs for a read
# call whose answer is bounded and for an update's bounds (an id's pattern,
# a free text's length, an answer that never echoes what was written);
# Confluence differs where noted.
#
# Checked against Atlassian's OpenAPI descriptions of the Confluence Cloud
# REST API (v2 and v1) and its developer and support pages on 2 November
# 2026, and by GET requests without a login to a public Confluence Cloud
# site, which gave the shapes of the answers and of the cursors. Not
# checked with a credential against a site of our own: a person has to make
# one (README.md says what that leaves open).
#   spaces:   GET /wiki/api/v2/spaces takes read:space:confluence and
#     answers {results, _links}. _links.next is there only when another
#     page is, and is the path of the next page with its cursor in it. v2
#     also gives that address in a Link header, which a declared call
#     cannot read, so the cursor is a parameter and the body's _links stays.
#   page:     GET /wiki/api/v2/pages/{id} takes read:page:confluence.
#     body-format=storage puts the body at body.storage.value. Confluence
#     storage format is XHTML with Confluence's own tags and macros
#     (ac:structured-macro, ri:page), and it is what comes back: turning
#     it into text is the reader's.
#   children: GET /wiki/api/v2/{kind}/{id}/direct-children takes
#     read:hierarchical-content:confluence. Atlassian marks the older
#     /pages/{id}/children deprecated, the one deprecated operation in v2.
#     The newer one answers a page's pages and also its folders,
#     whiteboards, databases and embeds, each with a type. The same
#     operation is also at /folders/{id}/direct-children,
#     /whiteboards/{id}/direct-children, /databases/{id}/direct-children
#     and /embeds/{id}/direct-children, with the same scope, parameters
#     and answer, so one call walks all five. Its kind is a child's type
#     and an s. It is an enum
#     because it becomes a segment of the path, and the enum is the only
#     check on it. Left out it is pages, so a call that names no kind
#     asks the page endpoint. A default in a path is what pack.yaml's
#     api: 3 is for.
#   search:   GET /wiki/rest/api/content/search takes search:confluence.
#     CQL search is v1 only: Atlassian has no v2 equivalent, and has said
#     it would deprecate this one only when there is. A hit is
#     {id, type, status, title, _links} and the rest of its keys are
#     empty objects and the paths of what expand would add; _links.webui
#     names the space (/spaces/ENG/pages/123/Title), so nothing is
#     expanded. The cursor is the one in _links.next, percent-decoded:
#     that address writes it percent-encoded, and the call encodes it
#     again. Its start is echoed and ignored, so none is declared.
#
# The comments, labels and attachments of a page were checked the same
# way on 4 November 2026: the OpenAPI description of v2, and GET requests
# without a login to a public Confluence Cloud site. The site had no
# inline comment to show, so the inline shapes are the description's.
#   comments: GET /wiki/api/v2/pages/{id}/footer-comments and
#     /wiki/api/v2/pages/{id}/inline-comments take read:comment:confluence
#     and answer {results, _links}, paged as spaces is. Both list the root
#     comments of the page and no reply: the description says root, and on
#     a page whose comment has a reply the list gave the comment alone. A
#     comment has no body unless body-format is named, so it is fixed to
#     storage as page's is, and the body is at body.storage.value, markup
#     and not text. A footer comment belongs to the page. An inline comment
#     is on a passage of its text, and adds properties.inlineOriginalSelection,
#     the passage. Either may carry resolutionStatus (open, reopened,
#     resolved or dangling): the footer comments of the public site did,
#     though the description lists it for inline comments only. The two are
#     one call because only a segment of the path differs, and that segment
#     is kind, an enum, the only check on it. It has no default: with footer
#     for one, a call that left kind out would read the footer comments and
#     look complete. A page id that does not exist answered 400 here, though
#     the description says 404; labels and attachments answered 404.
#   replies:  GET /wiki/api/v2/footer-comments/{id}/children and
#     /wiki/api/v2/inline-comments/{id}/children take the same scope and
#     answer the replies to one comment, each with parentCommentId. A reply
#     may have replies of its own, so a thread is walked down by id, with
#     the kind of the comment it started from. The other kind is no error:
#     a footer comment's id asked as inline answered 200 and an empty list.
#   labels:   GET /wiki/api/v2/pages/{id}/labels takes read:page:confluence,
#     which page needs already, and answers {results, _links}. A label is
#     {id, name, prefix}.
#   attachments: GET /wiki/api/v2/pages/{id}/attachments takes
#     read:attachment:confluence and answers the files attached to a page
#     as metadata: id, title (the file's name), mediaType, fileSize,
#     status, createdAt, version, comment, downloadLink and webuiLink. Both
#     links are paths on the site, which _links.base completes. Nothing
#     here follows one: what a file holds is yardr-racg's to settle. A
#     file's entry is about a kilobyte, so 250 may pass the bound of 256 KiB.
#
# The author of a comment or a file was checked on 4 November 2026 the same
# way: the OpenAPI description of v1, and GET requests without a login to
# the public site.
#   user:     GET /wiki/rest/api/user takes read:confluence-user (the
#     description lists read:content-details:confluence beside it as beta,
#     as it does for search) and answers one account for the accountId in
#     its query: 404 for an id that is not there, 403 for a caller who may
#     not view users. That id is version.authorId in the answers of
#     comments, replies and attachments, and is seen in two forms, 24 hex
#     digits and a number, a colon and a UUID. The call is v1 because v2
#     has no GET for a user (its likes/users answer ids alone), and its one
#     lookup by id is POST /users-bulk, a list of ids in a body. A declared
#     call takes no list, so no bulk is built: v1's /user/bulk takes a list
#     of accountId that the description does not say how to write, and a
#     query here holds one value to a key. One call names one account. Of a
#     User's keys three are kept: accountId, displayName and accountType
#     (atlassian, app, or empty). email, profilePicture, publicName and
#     timeZone are among the rest, which every agent granted read would see
#     and naming an author does not need. The public site answered 403 to a
#     caller without a login, for the two ids tried, so the 404 is the
#     description's.
#
# The two writes were checked on 22 November 2026 the same way: the OpenAPI
# description of v2 (2.0.0), and the Atlassian pages named below. Neither was
# called, with a login or without: a write needs an account.
#   create:   POST /wiki/api/v2/pages takes write:page:confluence ("Create and
#     update pages and blog posts and their properties"), the one scope the
#     description lists for it, and names no classic write:confluence-content.
#     Its body requires spaceId and takes status (current publishes, draft
#     does not), title (required unless a draft), parentId and body
#     {representation, value}. The call sends spaceId, parentId, status
#     current, title and the body in storage format, and none of the three
#     query parameters (embedded, private, root-level), so a page is made
#     published, under the parent the caller names, and never at the root of a
#     space. parentId is optional in the description and required here: left
#     out, Confluence puts the page under the space's home page. The answers
#     are 200, 400 (an invalid request), 401, 404 (the description lists as
#     one: no such space, none the account may view, none it may create a
#     page in) and 413 (over 5 MB, which the 60000 characters of body stay far
#     below).
#   update:   PUT /wiki/api/v2/pages/{id} takes the same scope. Its body
#     requires id, status, title, body and version, so a call with no title
#     is a 400 and the title is a parameter: the page's own, to keep it, or
#     another, to rename the page. version.number is the version the update
#     makes, "the current version number plus one", and that is the guard
#     against a clobber: Confluence refuses any other number with a 409.
#     Atlassian's ticket CONFCLOUD-76640 and a developer-community thread of
#     January 2026 show its body, {"errors": [{"status": 409, "code":
#     "CONFLICT", "title": "Version must be incremented when updating a page.
#     Current Version: [5]. Provided version: [5]", "detail": null}]}. The
#     description documents no error body, and the one 409 it lists for this
#     request is another: content approvals are on in the page's space and the
#     change must be saved as a draft. So the call keeps a refusal's errors, and
#     the caller tells the two by what they say: the stale one's title carries
#     the current version, and no body of the other was seen. A page the account
#     may not update answers 404, as for create.
#     status is sent as current. The description lets it be draft too, and
#     says that a trashed page is restored to current by an update, with no
#     change to its contents: no delete. parentId (which moves the page under
#     another parent in its space), spaceId and ownerId (which hands the page
#     to another account) are not sent. The description also says that an
#     update of the current version is merged into the page's draft and that,
#     if two versions are significantly diverged, "the latest provided content
#     may entirely override what was previously in the draft": a person's
#     unsaved draft is not under the version's guard.
#   scope:    a token with scopes that lacks write:page:confluence is answered
#     401, as for the reads ("Unauthorized; scope does not match", and
#     Atlassian's support article on a scoped token's 401s names a missing
#     scope as a cause). The description lists no 403 for either request, and
#     an account that may not write in the space is a 404. A token made
#     without scopes writes wherever the account may, which SETUP.md says.
#   answers:  both requests answer the page with its body. The select keeps
#     id, status, version and _links, so the body is never given back, about
#     430 bytes. A refusal's kept errors are bounded the same way, at 16 KiB,
#     so one that repeated a long body in its words is refused as too large
#     and not shown.
#   again:    neither takes a key to run once, so the file names no
#     idempotency header. A create tried again after a lost answer sends the
#     same request. Atlassian's v1 description refuses a page whose title is
#     already in the space for a blueprint page and for a move, and v2's lists
#     no such 400 for this request, so what a second create does was not
#     tried. An update tried again after a lost answer is pinned to the same
#     version, which the first made if it landed, so the second is refused.
#
# The credential. Atlassian takes an API token as HTTP Basic, the base64 of
# "email:token". A declared call's header takes one {credential}, so the
# email and the token are two mint inputs and confluence/mint makes the one
# value every call takes, CONFLUENCE_AUTH. The email is no secret, so it is
# asked in the clear. They live in the source's own env file; the
# jira pack's source has one of its own and is given the same two values
# again. Atlassian's form for a token with scopes has you choose the app
# first, so Jira's token is not made for Confluence, where a token made
# without scopes is the account's and serves both (SETUP.md, step 1).
# The two writes take this same login, with no second variable
# (credential.update_env), as google-docs' reads and writes share
# GOOGLE_TOKEN. What the token may write is its scopes' and the account's
# space permissions' (SETUP.md, step 1), and which agent may call a write is
# the grant of the call by its name (step 4).
#
# The host. Confluence is per site, so base is a placeholder: the
# credential goes to the hosts a file names and to no others. A token with
# scopes is called at https://api.atlassian.com/ex/confluence/<cloud id>/wiki
# and one without at https://<site>.atlassian.net/wiki (Atlassian's support
# article on scoped tokens). Both take Basic, so only the base differs, and
# the /wiki is the base's, so every path below starts at /api or /rest.
# Each address has a template, so the operator gives it on a card or at a
# terminal and no copy of this file, and the setting survives a pack
# applied again (SETUP.md, steps 2 and 6). For a token without scopes,
# base_template takes the site's host (yardr source set confluence
# host=<site>.atlassian.net). The gateway is one host for every site and
# varies in a path segment, the cloud id, which path_template takes: {site}
# stands once, as that one segment, and the product segment, confluence, is
# fixed here, so the operator says the cloud id and nothing of the path
# (yardr source set confluence site=<cloud id>). base, host and site
# replace each other. A key is given for the host and the cloud id
# together, so a key given for one site is held back from another site on
# the same host until it is given again (SETUP.md, step 2).
name: confluence
about: Confluence Cloud pages through its REST API; spaces listed, content found by CQL, one page read, the children of a page, folder, whiteboard, database or embed listed, a page's comments, replies, labels and attached files listed, and an author named from an account id; a page created under a parent and a page's title and body updated at its version.
base: https://example.atlassian.net/wiki
base_template: https://{host}/wiki
path_template: https://api.atlassian.com/ex/confluence/{site}/wiki
credential:
  env: CONFLUENCE_AUTH
  header: "Authorization: Basic {credential}"
  mint:
    - name: CONFLUENCE_EMAIL
      secret: false               # an address, asked in the clear
    - CONFLUENCE_API_TOKEN
  mint_command: [confluence/mint]   # the program beside this file; the source's own mint_command wins over it
check: spaces
calls:
  spaces:
    kind: read
    about: List the spaces the account may see, 25 at a time. Answers each space's id, key, name, type and homepageId, the page children starts from. keys narrows it to spaces by key, as an address shows it (/spaces/ENG/...). When more than limit follow, _links.next is in the answer, and its cursor= value is the next call's cursor.
    params:
      keys: { type: string, max: 500, optional: true, log: true }   # space keys, comma-separated; left out, every space the account may see
      limit: { type: int, default: 25 }   # spaces in the page, 250 at most
      cursor: { type: string, max: 1000, optional: true }   # the cursor= of the last answer's _links.next
    request:
      method: GET
      path: /api/v2/spaces
      query: { keys: "{keys}", limit: "{limit}", cursor: "{cursor}" }
    answer: { select: [results, _links], max: 262144 }   # 250 spaces are about 100 KB
  page:
    kind: read
    about: Read one page by its id, which is in its address (/spaces/ENG/pages/123456/Title). Answers its title, status, spaceId, parentId, version and links, and its body in Confluence storage format, in body.storage.value, which is XHTML with Confluence's own tags and macros, markup and not text.
    params:
      id: { type: string, pattern: "^[0-9]+$", max: 20, log: true }
    request:
      method: GET
      path: /api/v2/pages/{id}
      query: { body-format: storage }
    answer: { select: [id, status, title, spaceId, parentId, parentType, version, body, _links], max: 262144 }   # a page's body is bounded as google-docs bounds a document's
  children:
    kind: read
    about: List the direct children of a page, folder, whiteboard, database or embed, 25 at a time, in the order of the tree. Answers each child's id, title, status and type (page, folder, whiteboard, database or embed). To go down a level, give the child's id, and give its type with an s as kind. A child whose type is folder takes kind=folders. kind is one of pages (the default), folders, whiteboards, databases and embeds. When more than limit follow, _links.next is in the answer, and its cursor= value is the next call's cursor, with the same id and kind.
    params:
      id: { type: string, pattern: "^[0-9]+$", max: 20, log: true }
      kind: { type: enum, values: [pages, folders, whiteboards, databases, embeds], default: pages, log: true }   # the sort of node id is, written as a child's type and an s
      limit: { type: int, default: 25 }   # children in the page, 250 at most
      cursor: { type: string, max: 1000, optional: true }   # the cursor= of the last answer's _links.next
    request:
      method: GET
      path: /api/v2/{kind}/{id}/direct-children
      query: { limit: "{limit}", cursor: "{cursor}" }
    answer: { select: [results, _links] }
  search:
    kind: read
    about: Find content by CQL, Confluence's query language, 25 at a time, as in type = page AND space = "ENG" AND title ~ "runbook". Answers each hit's id, type, status, title and _links.webui, which names its space. When more than limit follow, _links.next is in the answer, and its cursor= value, percent-decoded, is the next call's cursor.
    params:
      cql: { type: string, max: 2000 }   # free text, CQL: its value is in no event
      limit: { type: int, default: 25 }   # hits in the page; Confluence may hold it lower
      cursor: { type: string, max: 1000, optional: true }   # the cursor= of the last answer's _links.next, percent-decoded
    request:
      method: GET
      path: /rest/api/content/search
      query: { cql: "{cql}", limit: "{limit}", cursor: "{cursor}" }
    answer: { select: [results, size, limit, _links], max: 262144 }   # a hit is about 800 bytes, most of it empty keys
  comments:
    kind: read
    about: List the comments on a page, given by its id, 25 at a time, of one kind. kind=footer is the discussion under the page and kind=inline is the comments on a passage of its text, so a page is read with both. Only the first comment of each thread is listed here; its replies are the call replies, by the comment's id. Answers each comment's id, status, pageId, version (number, authorId, createdAt) and its body, in Confluence storage format, in body.storage.value, markup and not text. A comment may have resolutionStatus (open, reopened, resolved or dangling), and an inline comment has properties.inlineOriginalSelection, the passage it is on. When more than limit follow, _links.next is in the answer, and its cursor= value is the next call's cursor.
    params:
      id: { type: string, pattern: "^[0-9]+$", max: 20, log: true }   # the page's id, from its address (/spaces/ENG/pages/123456/Title)
      kind: { type: enum, values: [footer, inline], log: true }   # no default: a call that leaves it out is refused, not taken for all the comments
      limit: { type: int, default: 25 }   # comments in the page, 250 at most
      cursor: { type: string, max: 1000, optional: true }   # the cursor= of the last answer's _links.next
    request:
      method: GET
      path: /api/v2/pages/{id}/{kind}-comments
      query: { body-format: storage, limit: "{limit}", cursor: "{cursor}" }
    answer: { select: [results, _links], max: 262144 }   # the bodies are bounded as page's is
  replies:
    kind: read
    about: List the replies to one comment, 25 at a time. Give the comment's id and its kind, footer or inline, as comments lists it. A kind that is not the comment's is no error and answers an empty list. Answers each reply as a comment is answered, with parentCommentId, the id of the comment it answers. A reply may have replies of its own, and its id with the same kind goes down a level. When more than limit follow, _links.next is in the answer, and its cursor= value is the next call's cursor.
    params:
      id: { type: string, pattern: "^[0-9]+$", max: 20, log: true }   # the comment's id
      kind: { type: enum, values: [footer, inline], log: true }   # the comment's kind, as comments takes it
      limit: { type: int, default: 25 }   # replies in the page, 250 at most
      cursor: { type: string, max: 1000, optional: true }   # the cursor= of the last answer's _links.next
    request:
      method: GET
      path: /api/v2/{kind}-comments/{id}/children
      query: { body-format: storage, limit: "{limit}", cursor: "{cursor}" }
    answer: { select: [results, _links], max: 262144 }   # the bodies are bounded as page's is
  labels:
    kind: read
    about: List the labels on a page, given by its id, 25 at a time. Answers each label's id, name and prefix. When more than limit follow, _links.next is in the answer, and its cursor= value is the next call's cursor.
    params:
      id: { type: string, pattern: "^[0-9]+$", max: 20, log: true }   # the page's id
      limit: { type: int, default: 25 }   # labels in the page, 250 at most
      cursor: { type: string, max: 1000, optional: true }   # the cursor= of the last answer's _links.next
    request:
      method: GET
      path: /api/v2/pages/{id}/labels
      query: { limit: "{limit}", cursor: "{cursor}" }
    answer: { select: [results, _links] }   # a label is about 60 bytes, so 250 fit the default bound
  attachments:
    kind: read
    about: List the files attached to a page, given by its id, 25 at a time. Answers the metadata of each file and not the file. That is its id, title (the file's name), mediaType, fileSize in bytes, status, createdAt, version, comment, and downloadLink and webuiLink, which are paths on the site that go after _links.base. Nothing here fetches a file. When more than limit follow, _links.next is in the answer, and its cursor= value is the next call's cursor.
    params:
      id: { type: string, pattern: "^[0-9]+$", max: 20, log: true }   # the page's id
      limit: { type: int, default: 25 }   # attachments in the page, 250 at most
      cursor: { type: string, max: 1000, optional: true }   # the cursor= of the last answer's _links.next
    request:
      method: GET
      path: /api/v2/pages/{id}/attachments
      query: { limit: "{limit}", cursor: "{cursor}" }
    answer: { select: [results, _links], max: 262144 }   # an attachment is about 1 KB, so 250 may pass this bound, and a smaller limit then fits
  user:
    kind: read
    about: Name the author of a comment or a file, given an Atlassian account id, which is version.authorId in the answers of comments, replies and attachments. Answers that account's accountId, displayName and accountType (atlassian for an Atlassian account, app for the bot user of an app, or empty) and nothing else of it. Names one account a call, so several authors are several calls. A 404 is an id that is not there, and a 403 is an account that may not view users. The name may be limited by the user's profile visibility.
    params:
      accountId: { type: string, pattern: "^[A-Za-z0-9:._-]+$", max: 128, log: true }   # 24 hex digits, or a number, a colon and a UUID; the pattern blocks /, ?, & and a space
    request:
      method: GET
      path: /rest/api/user
      query: { accountId: "{accountId}" }
    answer: { select: [accountId, displayName, accountType] }   # three keys of a user's many, about 150 bytes, so the default bound holds
  create:
    kind: update
    about: Create one page under a parent page in a space, and publish it. Give the space's id (spaces answers it), the parent page's id (its address shows it, /spaces/ENG/pages/123456/Title), a title, and the body in Confluence storage format, which is XHTML with Confluence's own tags, markup and not text, at most 60000 characters. Plain paragraphs, headings and tables serve; Confluence judges the markup and answers 400 for what it cannot parse. A page is never made at the root of a space, since the parent is required. Answers the new page's id, status, version and links, and never its body. Confluence takes no key to write once, so a call tried again after a lost answer may make a second page. Changes the wiki at once.
    params:
      spaceId: { type: string, pattern: "^[0-9]+$", max: 20, log: true }   # the space's id, as spaces gives it, and not its key
      parentId: { type: string, pattern: "^[0-9]+$", max: 20, log: true }   # the page the new one goes under, from its address; required, so no page lands at the root of a space
      title: { type: string, pattern: '^[^\x00-\x1f\x7f]+$', max: 255 }   # one line of text and not empty, no control character; 255 is this file's bound, the length a community answer gives for a title and Atlassian's description does not, and Confluence judges the rest (a title already in the space is refused); free text: its value is in no event
      body: { type: string, max: 60000 }   # storage format, as page's body.storage.value shows it; free text: its value is in no event. Confluence judges the markup, and this file builds no macro
    request:
      method: POST
      path: /api/v2/pages
      body:
        spaceId: "{spaceId}"
        parentId: "{parentId}"
        status: current   # published; a draft is not made here
        title: "{title}"
        body: { representation: storage, value: "{body}" }
    answer: { select: [id, status, version, _links], errors: [errors, message], max: 16384 }   # the page comes back with its body, which the select drops; a refusal keeps Confluence's errors (and the gateway's message), under the same bound
  update:
    kind: update
    about: Replace one page's title and body, by its id, at the next version. version is the version.number that page answered, plus one, and Confluence refuses any other number with a 409. title is required, so give the page's current title to keep it, or another to rename the page. The body is the whole new body in storage format (markup, at most 60000 characters); what it leaves out is gone from the new version, and the earlier one stays in the page's history. If a person saved the page meanwhile, the call fails 409 and errors says Current Version and its number, so read the page again and call again with that number plus one. Nothing here retries or merges. A person's unsaved draft is not under the guard and may be overridden. Another 409, for a space that requires approval before publishing, needs the change saved as a draft, which this call does not do. Answers the page's id, status, version and links, never its body. Changes the wiki at once.
    params:
      id: { type: string, pattern: "^[0-9]+$", max: 20, log: true }   # the page's id, from its address
      version: { type: int, log: true }   # the number the page's version becomes: the version.number page answered, plus one; Confluence judges it
      title: { type: string, pattern: '^[^\x00-\x1f\x7f]+$', max: 255 }   # required by Confluence: the page's own title to keep it, as for create one line and not empty; free text: its value is in no event
      body: { type: string, max: 60000 }   # the whole new body, in storage format; free text: its value is in no event
    request:
      method: PUT
      path: /api/v2/pages/{id}
      body:
        id: "{id}"
        status: current   # a trashed page would be restored by this, never deleted; no parentId, spaceId or ownerId is sent, so the page is not moved or handed over
        title: "{title}"
        body: { representation: storage, value: "{body}" }
        version: { number: "{version}" }
