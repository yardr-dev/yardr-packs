# Confluence Cloud as a pack of kind source: the integration, imported
# into the yard and into no depot. What Confluence is here: the declared
# source confluence, which lists spaces, finds content by CQL, reads a
# page, lists the children of a page, folder, whiteboard, database or
# embed, lists a page's comments, the replies to a comment, its labels and
# its attached files, and names an author from an account id, creates a
# page under a parent and updates a page's title and body at its version,
# all through the REST API as one Atlassian account. The two writes change
# the wiki at once, so each is granted by its name alone, and `read` covers
# neither. Every agent granted a read reads what that account may read, and
# one granted a write writes where that account may.
#
#   yardr pack apply <pack dir>
#
# The source is named confluence: a pack is named after the service it
# talks to. Confluence is per site, so the declaration ships a placeholder
# address and a base_template: SETUP.md has the operator give the site's
# host, or, for a token with scopes, replace the address in the yard's copy.
# The login is the Atlassian account the jira pack uses, given to this
# source in its own env file. The pack is written for pack API 3, because
# children's kind has a default and is in a path, which API 3 added. A
# yardr that reads less is told to upgrade and is not given an error about
# the path.
name: confluence
api: 3
kind: source
setup: SETUP.md

sources:
  confluence:
    declaration: confluence.yaml

# Suggested grants: named sets of the source's calls, printed numbered by
# pack show. Suggesting grants nothing: the operator grants them, and a
# terminal pack apply ignores them. read covers every read call and no
# update; each update is granted by its name alone, one preset to each.
presets:
  read:
    about: List spaces, find content by CQL, read a page, list the children of a page, folder, whiteboard, database or embed, list a page's comments, replies, labels and attached files, and name an author from an account id; change nothing
    grants:
      confluence: [read]
  create:
    about: Create a page under a parent page and publish it; changes the wiki at once
    grants:
      confluence: [create]
  update:
    about: Replace one page's title and body at the next version; changes the wiki at once
    grants:
      confluence: [update]
