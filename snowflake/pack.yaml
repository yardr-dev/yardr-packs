# Snowflake as a pack of kind source: the integration, imported into the
# yard and into no depot. What Snowflake is here: the declared source
# snowflake, which runs a SELECT and bounds its answer, lists the databases,
# schemas and tables, and reads a statement back by its handle, all
# through Snowflake's SQL API as one Snowflake user. One call, kept apart,
# runs any other statement the user's role allows. Its credential is
# minted from the user's key pair, by snowflake/mint, the mint command the
# pack brings beside its declaration.
#
#   yardr pack apply /Users/mckean/projects/repos/yardr-packs/snowflake
#
# The source is named snowflake: a pack is named after the service it
# talks to. Snowflake is per account, so the declaration ships a
# placeholder address that SETUP.md has the operator replace in the yard's
# copy. A pack of kind source asks no grants at import, so what a crew
# member may call is granted afterwards, by the setup notes. Every agent
# granted a call acts as that one Snowflake user: what its role may read or
# change is the bound, whatever the calls accept.
name: snowflake
kind: source
setup: SETUP.md

sources:
  snowflake:
    declaration: snowflake.yaml

# Suggested grants: named sets of the source's calls, printed numbered by
# pack show. Suggesting grants nothing: the operator grants them, and a
# terminal pack apply ignores them. A preset names read, every read call,
# or a call by its name: no word stands for every update, so write is the
# one update call, execute. The two are apart on purpose, and a grantee who
# needs both is given both.
presets:
  read:
    about: Run a SELECT with a bounded answer, list databases, schemas and tables, and read a statement back; change nothing
    grants:
      snowflake: [read]
  write:
    about: Run one statement that is not a SELECT, as the role allows; read is a preset of its own
    grants:
      snowflake: [execute]
