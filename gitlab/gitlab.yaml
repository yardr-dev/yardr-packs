# GitLab as a declared source, in the shape of yardr's GitHub: how the core
# verifies a GitLab delivery, and the command that turns a verified body
# into the envelope; what the yard does in a GitLab thread, by one command
# per thing; how it reads a merge request and its CI back; GitLab's issue
# and merge request URLs as a bead's link; and what an agent may ask of it.
#
# Two slices made it. The first is hearing and speaking, issues and merge
# requests alike. The second is reading a merge request and its pipelines
# back (the `events` key) and the calls an agent makes (`calls`, and the
# pack's presets). What is not here: git hosting for a depot whose origin is
# on gitlab.com (a `git` credential helper, as GitHub's), and group
# webhooks.
#
# Checked against GitLab's own docs on 2 November 2026 (docs.gitlab.com,
# master): user/project/integrations/webhooks.md and webhook_events.md for
# the headers and the issue, merge request, comment and pipeline payloads;
# api/notes.md, api/issues.md, api/merge_requests.md and api/rest/_index.md
# for what the thread commands send; api/merge_requests.md, api/pipelines.md,
# api/jobs.md, api/projects.md and api/issues.md for what the merge request
# reads and the calls send; user/profile/personal_access_tokens.md and
# security/tokens/access_token_scopes.md for the credential.
#
# A command is a list, run without a shell. A path that does not start
# with / is a file beside this one, which `yardr source add` copies into
# the yard.
name: gitlab
about: GitLab issues and merge requests. Hears its webhooks and speaks in its threads.

# The name of the variable, never the value. A personal access token with
# the scope api: a token that may only read (read_api) cannot reply, open
# or close anything. A command gets it in its environment under this name,
# and gets no other variable of the yard. hook.normalize is handed no
# credential at all. GitLab takes a personal access token in a
# PRIVATE-TOKEN header.
credential:
  env: GITLAB_TOKEN
  header: "PRIVATE-TOKEN: {credential}"

# ---- what it sends us ----------------------------------------------------

hook:
  # Adapter.Verify stays data, checked by the core: the secret is handed to
  # no command, and an unverified body reaches none. GitLab's webhook has
  # a secret token, which it sends as it is in X-Gitlab-Token, so the
  # header is compared as it arrives. The delivery is told by
  # Idempotency-Key, which GitLab keeps the same across a delivery's
  # retries (GitLab 17.4 on; before, no id is sent and a retry is told by
  # its body).
  verify:
    scheme: secret
    signature: { header: X-Gitlab-Token }
    delivery:  { header: Idempotency-Key }
  # Per hook, not per source: GitLab sends an event's body to every webhook
  # of the project, and each hook records its own.
  bodies: unique-per-hook
  # GitLab's deliveries follow activity, not a rhythm: an idle hour after
  # the last comment is no break, so the quiet check does not time them.
  untimed: true

  # Adapter.Normalize. stdin {"headers":{…},"body":{…}}, stdout the
  # envelope. The core sets source and delivery itself, and derives the
  # envelope's train from its head_branch, which the command leaves out.
  normalize: [gitlab/normalize]

  # The keys its events' fields may carry: a subscription's --where may
  # name them beside type, action, team, project, repo and label. sender is
  # the lowercased username of whoever caused the event, which hear below
  # matches by identity; noteable is what a comment is on (issue,
  # merge_request, commit or snippet); conclusion is how a pipeline ended,
  # in the words the core judges CI by (success, failure, cancelled or
  # skipped), and is none while it runs.
  keys: [number, state, noteable, conclusion, head_branch, head_sha, head_repo, base, train, sender]

# ---- what it sends about merge requests and CI ----------------------------
# Which envelopes are CI runs, which tell the merge request's head commit,
# and the commands that read the merge request and its CI back. The daemon
# judges a run against the head the last head_from event carried, or the
# head the pr command reads live, and reads CI as state for a train whose
# hook's table has an event=ci line for it; a train's brief carries the ci
# command's snapshot. Both run as a thread command does, with the
# credential under GITLAB_TOKEN. gitlab/mr is the script, with the two as
# its commands. The shapes are in docs/integrations.md.
#
# A pipeline is GitLab's run of CI, and the merge request's own events tell
# its head (last_commit). The known gap below holds here as for `says` lines:
# an event for merge request !7 may find the bead that tracks issue #7.
events:
  runs: [pipeline]            # the types that are CI runs, whatever became of them
  head_from: [merge_request]  # the types that tell the merge request's head
  pr: [gitlab/mr, pr]         # in  {repo, number, url}  out {head, base, state}
  ci: [gitlab/mr, ci]         # in  {repo, number, sha}  out {head, base, state, required, checks}

# ---- who is heard ---------------------------------------------------------
# A delivery is kept when its sender is a user of the yard, matched by
# identity: fields.sender holds the sender's username, lowercased, which
# normalize also sets as actor.id. The core adds fields.speaker for a
# kept delivery (the yard user's name, or outside where the hook's
# --unknown word allows an unmapped sender); speaker is the derived
# filter key for this hear, and stands in no hook.keys above, which
# names only what normalize may set.

hear:
  field: sender
  by: identity

# ---- what the yard does in its threads ------------------------------------
# One command per thing, each handed its object on stdin and the
# credential under GITLAB_TOKEN, with YARDR_SOURCE_BASE from base below.
# gitlab/thread is the script: reply posts a note on the issue or merge
# request with the key in a marker comment, posted finds what a key left
# ({} for none), read lists the thread's notes oldest first, open starts an
# issue in the project in, opened finds what an open left ({} for none:
# posted's sibling for open), and state moves to what the word means:
# exactly, or never backwards with forward (a stage map's move). A thread
# is GitLab's own reference to it: group/project#12 is an issue and
# group/project!12 a merge request, and the one script serves both, told
# apart by that character. The shapes are in docs/integrations.md.

thread:
  reply:  [gitlab/thread, reply]      # in  {thread, parent, body, key}      out {id, url}
  posted: [gitlab/thread, posted]     # in  {thread, key}                    out {id, url} or {}
  read:   [gitlab/thread, read]       # in  {thread}                         out {messages: [...]}
  place:  project                     # what open's in names
  open:   [gitlab/thread, open]       # in  {in, title, body, key, assignee?} out {id, title, url}
  assignee: key                       # the assignee open takes: a username
  opened: [gitlab/thread, opened]     # in  {in, key, since?}                out {id, title, url} or {}
  state:  [gitlab/thread, state]      # in  {thread, state, forward?}        out {status, moved, was?}
  states: [started, done]             # the words it has a status for: an issue or merge request is open or closed
  labels: true                        # and a label:<name> adds the label, to any thread

# ---- who a crew member is in it -------------------------------------------
# GitLab usernames are the same in any case, and its deliveries carry them
# as they are written: normalize lowercases them, and a key is kept
# lowercase however it was typed.

identity:
  fold: lower

# ---- its issues and merge requests as a bead's link -----------------------
# The host its URLs are on, what reads an issue from a URL's path, and over
# the groups: the whole project path (its namespace may nest to any depth)
# and the number. The issue's one fixed form puts the /-/ GitLab writes now
# before issues; the old form without it reads too. A merge request is the
# second shape, over the same groups in the same order. Only gitlab.com is
# named: a self-managed instance has a host of its own, which the file
# cannot list (SETUP.md says what to change).
#
# GitLab numbers its issues and its merge requests apart: issue #7 and
# merge request !7 are two things. The core reads the two shapes as one
# numbered thread, so it takes either for the other (README.md, "A known
# gap").

link:
  host: gitlab.com
  issue: '^/((?:[A-Za-z0-9_.][A-Za-z0-9_.-]*/)+[A-Za-z0-9_.][A-Za-z0-9_.-]*)/(?:-/)?issues/([1-9][0-9]*)(?:/.*)?$'
  fixed: "https://gitlab.com/{1}/-/issues/{2}"
  thread: "{1}#{2}"
  fold: lower
  pull:
    issue: '^/((?:[A-Za-z0-9_.][A-Za-z0-9_.-]*/)+[A-Za-z0-9_.][A-Za-z0-9_.-]*)/(?:-/)?merge_requests/([1-9][0-9]*)(?:/.*)?$'
    fixed: "https://gitlab.com/{1}/-/merge_requests/{2}"
    thread: "{1}!{2}"
  repos: '(?:[A-Za-z0-9_.][A-Za-z0-9_.-]*/)+[A-Za-z0-9_.][A-Za-z0-9_.-]*'

# ---- what an agent may ask of it, through `yardr call` -------------------
# Reads of GitLab's REST API as the account of the credential, and nothing
# written: each is a GET, granted to no one until the operator grants it
# (SETUP.md; the pack's `read` preset names them all). The credential
# needs the scope read_api for them, and has api for the thread commands.
#
# project is a project as GitLab names it in a path: group/project, with
# subgroups to any depth, or its number. It is one segment of the request's
# path, so the slashes go as %2F. The pattern lets no two dots stand
# together: the core refuses a segment that is only "..", and not one that
# holds it among escaped slashes. iid is the number of an issue or merge
# request in its project, its internal id. GitLab numbers issues and merge
# requests apart, so the two calls are told apart by name, not by the number.
#
# The lists ask for 20 of the newest by default, and for any page after
# (GitLab answers at most 100 to a page). The answers keep the fields an
# agent reads and leave out the many a call returns that it does not; a
# list leaves out descriptions, which the call for one has.
#
# It names no check call on purpose: `yardr source check` looks at the
# credential and at the thread commands above, and sends nothing.
#
# base is the REST API every thread command and every call sends to, as
# YARDR_SOURCE_BASE.

base: https://gitlab.com/api/v4
calls:
  user:
    kind: read
    about: Who the credential acts as.
    request: { method: GET, path: /user }
    answer: { select: [username, name] }
  project:
    kind: read
    about: Read a project, its default branch and merge settings.
    params:
      project: { type: string, pattern: '^(?:[0-9]+|(?:[A-Za-z0-9_]|\.[A-Za-z0-9_-])(?:[A-Za-z0-9_-]|\.[A-Za-z0-9_-])*(?:/(?:[A-Za-z0-9_]|\.[A-Za-z0-9_-])(?:[A-Za-z0-9_-]|\.[A-Za-z0-9_-])*)+)$', max: 255, log: true }
    request: { method: GET, path: "/projects/{project}" }
    answer: { select: [id, name, path_with_namespace, description, default_branch, visibility, web_url, archived, created_at, last_activity_at, open_issues_count, issues_enabled, merge_requests_enabled, only_allow_merge_if_pipeline_succeeds, allow_merge_on_skipped_pipeline, only_allow_merge_if_all_discussions_are_resolved, merge_method, topics] }
  merge_request:
    kind: read
    about: Read a merge request by its number, with its branches, head commit, head pipeline and merge status.
    params:
      project: { type: string, pattern: '^(?:[0-9]+|(?:[A-Za-z0-9_]|\.[A-Za-z0-9_-])(?:[A-Za-z0-9_-]|\.[A-Za-z0-9_-])*(?:/(?:[A-Za-z0-9_]|\.[A-Za-z0-9_-])(?:[A-Za-z0-9_-]|\.[A-Za-z0-9_-])*)+)$', max: 255, log: true }
      iid: { type: string, pattern: "^[1-9][0-9]{0,9}$", log: true }
    request: { method: GET, path: "/projects/{project}/merge_requests/{iid}" }
    # The description is read whole, up to what a call may raise its bound to.
    answer: { select: [iid, title, description, state, draft, source_branch, target_branch, source_project_id, target_project_id, sha, author, assignees, reviewers, labels, milestone, created_at, updated_at, merged_at, closed_at, detailed_merge_status, has_conflicts, blocking_discussions_resolved, user_notes_count, merge_when_pipeline_succeeds, squash, head_pipeline, references, web_url], max: 262144 }
  pipelines:
    kind: read
    about: List a project's pipelines, newest first, of a branch or a commit or in a status.
    params:
      project: { type: string, pattern: '^(?:[0-9]+|(?:[A-Za-z0-9_]|\.[A-Za-z0-9_-])(?:[A-Za-z0-9_-]|\.[A-Za-z0-9_-])*(?:/(?:[A-Za-z0-9_]|\.[A-Za-z0-9_-])(?:[A-Za-z0-9_-]|\.[A-Za-z0-9_-])*)+)$', max: 255, log: true }
      ref: { type: string, max: 255, optional: true }
      sha: { type: string, pattern: "^[0-9a-fA-F]{7,64}$", optional: true }
      status: { type: enum, values: [created, waiting_for_resource, preparing, waiting_for_callback, pending, running, success, failed, canceling, canceled, skipped, manual, scheduled], optional: true }
      limit: { type: int, default: 20 }
      page: { type: int, default: 1 }
    request:
      method: GET
      path: "/projects/{project}/pipelines"
      query: { ref: "{ref}", sha: "{sha}", status: "{status}", order_by: id, sort: desc, per_page: "{limit}", page: "{page}" }
    answer: { select: [id, iid, project_id, status, source, ref, sha, name, web_url, created_at, updated_at], max: 262144 }
  issues:
    kind: read
    about: List a project's issues, newest first, by state, labels, author or words in the title and description.
    params:
      project: { type: string, pattern: '^(?:[0-9]+|(?:[A-Za-z0-9_]|\.[A-Za-z0-9_-])(?:[A-Za-z0-9_-]|\.[A-Za-z0-9_-])*(?:/(?:[A-Za-z0-9_]|\.[A-Za-z0-9_-])(?:[A-Za-z0-9_-]|\.[A-Za-z0-9_-])*)+)$', max: 255, log: true }
      state: { type: enum, values: [opened, closed, all], default: opened }
      labels: { type: string, max: 255, optional: true }    # comma-separated: the issue has all of them
      author: { type: string, pattern: "^[A-Za-z0-9_.-]{1,255}$", optional: true }
      search: { type: string, max: 255, optional: true }
      limit: { type: int, default: 20 }
      page: { type: int, default: 1 }
    request:
      method: GET
      path: "/projects/{project}/issues"
      query: { state: "{state}", labels: "{labels}", author_username: "{author}", search: "{search}", order_by: created_at, sort: desc, per_page: "{limit}", page: "{page}" }
    answer: { select: [iid, title, state, labels, author, assignees, milestone, created_at, updated_at, closed_at, due_date, confidential, issue_type, user_notes_count, merge_requests_count, web_url, references], max: 262144 }
  issue:
    kind: read
    about: Read an issue by its number, with its description.
    params:
      project: { type: string, pattern: '^(?:[0-9]+|(?:[A-Za-z0-9_]|\.[A-Za-z0-9_-])(?:[A-Za-z0-9_-]|\.[A-Za-z0-9_-])*(?:/(?:[A-Za-z0-9_]|\.[A-Za-z0-9_-])(?:[A-Za-z0-9_-]|\.[A-Za-z0-9_-])*)+)$', max: 255, log: true }
      iid: { type: string, pattern: "^[1-9][0-9]{0,9}$", log: true }
    request: { method: GET, path: "/projects/{project}/issues/{iid}" }
    answer: { select: [iid, title, description, state, labels, author, assignees, milestone, created_at, updated_at, closed_at, due_date, confidential, issue_type, user_notes_count, merge_requests_count, web_url, references], max: 262144 }
