# Visuals pack for yardr: the lane a composed visual takes before anyone
# holds the file. A bead of type visual carries a brief that names a format
# (a poster, a social card, a cover, a slide) and its size. A visual designer
# composes three directions at that exact size on the bead's branch and shoots
# each one, and a person looks at the shots, names the direction to hold, and
# holds its file with a PNG at the exact size (and a PDF where the brief is
# for print). Nothing lands.
# Like the starter pack it names no agent product, model, depot, person or
# secret: the import asks, and they stay in the yard. The format is the
# starter's (packs/starter/pack.yaml, docs/packs.md in the yardr repository).

name: visuals

# The kind of depot the pack is for: the directions are committed on the bead's
# branch.
kind: git

# The setup notes, for the operator: the import, the agent it asks for and the
# programs the shots need. pack check and pack apply print them.
setup: SETUP.md

# One flow, for beads of type visual, beside the flow the depot follows for its
# own work (the starter's, say): this pack has none without a type. The type is
# the pack's own because a type follows one flow. The webdesign pack's flow is
# for type mockup, so a pack that reused that type would have its import
# re-point every depot already on the mockup flow.
#
# There is no assembly stage. The directions stay on the bead's branch and the
# shots on its note, and the words of the person's pick name the direction to
# hold: landing all three files would put throwaways on the base, and landing
# one would need another agent to take the other two out. A bead ends at
# picked, where the person holds the picked file with its PNG (and its PDF for
# print) from the branch.
#
# Rounds are not limited. The only way back is a person's move from pick, with
# a note that says what to change, so a person decides each round.
flows:
  visual:
    type: visual
    stages:
      backlog:    { group: backlog,          file: flows/visual/backlog.md,    manual: [directions] }
      directions: { group: visual-designers, file: flows/visual/directions.md, outcomes: { done: pick, question: pick }, manual: [backlog] }
      pick:       { group: decisions,        file: flows/visual/pick.md,       manual: [picked, directions, backlog] }
      picked:     { end: true }

# The visual designers are a group of this pack's own. The webdesign pack takes
# a group of its own for the same reason: a pack names a group together with
# its role, so naming builders here would aim the depot's code builders at a
# designer's prompt, and naming webdesign's designers would aim this pack's
# role at mockup beads. The import makes <depot>-visual-designers and asks
# which agent runs it. One bead at a time: each serves its worktree and runs
# headless Chrome three times. A yard that wants more raises the limit of the
# group it has (yardr group set). backlog and decisions are the yard's two
# people groups, which the import reuses.
groups:
  visual-designers: { agent: roles/visual-designer.md, limit: 1 }
  backlog:          { people: true }
  decisions:        { people: true }

# The designer's role tells it to mail {{yardmaster}}, so the pack names the
# crew member, as the starter does. It hears a bead enter pick, a bead close,
# and the events that need someone. The pack carries no role for it: the
# yardmaster keeps the prompt it has.
crew:
  yardmaster:
    hears:
      events: [attention]
      stages: [pick]
      done: true
